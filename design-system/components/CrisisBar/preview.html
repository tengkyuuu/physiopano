<!-- @dsCard group="Safety" height=300 subtitle="Immediate guidance + human hand-off" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600&family=Noto+Kufi+Arabic:wght@400;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}
body{padding:var(--space-4)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:48px;padding:0 var(--space-5);border-radius:var(--radius-control);font:700 16px/1 var(--font-sans);border:1.5px solid transparent;cursor:pointer;transition:transform 140ms cubic-bezier(.16,1,.3,1)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-crisis{background:var(--crisis);color:var(--on-crisis)}
.btn[disabled]{background:var(--surface-sunk);color:var(--ink-muted);border-color:transparent;cursor:not-allowed}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.data{font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-grid;place-items:center;border-radius:var(--radius-pill);font:800 13px/1 var(--font-sans)}
.r1{background:var(--route-1);color:var(--on-route)} .r2{background:var(--route-2);color:var(--on-route)} .r3{background:var(--route-3);color:var(--on-route-3)} .r4{background:var(--route-4);color:var(--on-route)} .r5{background:var(--route-5);color:var(--on-route)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.cb{background:var(--crisis);color:var(--on-crisis);border-radius:var(--radius-panel);padding:var(--space-5);max-width:600px}
.cb h2{margin:0;font:800 24px/30px var(--font-sans)}
.cb p{margin:var(--space-2) 0 var(--space-4);font:400 16px/24px var(--font-sans);max-width:56ch}
.acts{display:flex;flex-wrap:wrap;gap:var(--space-3)}
.b1{background:var(--on-crisis);color:var(--crisis)}
.b2{background:transparent;color:var(--on-crisis);border-color:var(--on-crisis)}
.num{font:600 16px/1 var(--font-data)}
.fine{margin:var(--space-4) 0 0!important;font:400 14px/20px var(--font-sans)!important;opacity:.92}
</style>
<section class="cb" role="alert" aria-labelledby="cbh">
  <h2 id="cbh">You don't have to handle this alone.</h2>
  <p>You told us you've had thoughts of hurting yourself. A trained person can talk with you now. If you are in immediate danger, call an ambulance.</p>
  <div class="acts">
    <button class="btn b1"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Talk to a trained counsellor now</button>
    <button class="btn b2">Ambulance <span class="num">998</span></button>
  </div>
  <p class="fine">A counsellor will see only what you just answered. This screen stays until you close it.</p>
</section>
