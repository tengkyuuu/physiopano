<!-- @dsCard group="Wayfinding" height=470 subtitle="Your 14 days against your own band" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600&family=Noto+Kufi+Arabic:wght@400;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}
body{padding:var(--space-4)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:48px;padding:0 var(--space-5);border-radius:var(--radius-control);font:700 16px/1 var(--font-sans);border:1.5px solid transparent;cursor:pointer;transition:transform 140ms cubic-bezier(.16,1,.3,1)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-crisis{background:var(--crisis);color:var(--on-crisis)}
.btn[disabled]{background:var(--surface-sunk);color:var(--ink-muted);border-color:transparent;cursor:not-allowed}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.data{font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-grid;place-items:center;border-radius:var(--radius-pill);font:800 13px/1 var(--font-sans)}
.r1{background:var(--route-1);color:var(--on-route)} .r2{background:var(--route-2);color:var(--on-route)} .r3{background:var(--route-3);color:var(--on-route-3)} .r4{background:var(--route-4);color:var(--on-route)} .r5{background:var(--route-5);color:var(--on-route)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.lane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-panel);padding:var(--space-5);max-width:720px}
.lane h2{margin:0;font:700 24px/30px var(--font-sans)}
.lane .lead{margin:var(--space-2) 0 0;font:600 20px/28px var(--font-sans)}
.lane .note{margin:var(--space-2) 0 var(--space-4);font:400 16px/24px var(--font-sans);color:var(--ink-muted);max-width:60ch}
.lane svg{width:100%;height:auto;display:block}
.tk{font:600 11px var(--font-data);fill:var(--ink-muted)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-5);margin-top:var(--space-4);font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap}
.reading{font:600 16px/20px var(--font-data);color:var(--ink)}
</style>
<section class="lane">
  <h2>Heart-rate variability <span class="reading">· 38 ms today</span></h2>
  <p class="lead">Lower than your usual for the last 4 days.</p>
  <p class="note">This is not a diagnosis. It often follows short sleep, illness or a heavy week. A 2-minute check-in helps you make sense of it.</p>
  <svg viewBox="0 0 620 220" role="img" aria-label="Heart-rate variability over 14 days compared with your baseline band. The last 4 days sit below your band.">
 <rect x="40" y="73.3" width="520" height="53.3" fill="var(--brand)" fill-opacity=".14" rx="6"/>
 <line x1="40" y1="100.0" x2="560" y2="100.0" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="2 4"/>
 <text x="568" y="104.0" class="tk">your usual</text>
 <text x="568" y="77.3" class="tk">+1σ</text>
 <text x="568" y="130.7" class="tk">−1σ</text>
 <polyline points="40.0,97.3 80.0,108.0 120.0,94.7 160.0,89.3 200.0,102.7 240.0,100.0 280.0,113.3 320.0,110.7 360.0,124.0 400.0,132.0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
 <polyline points="400.0,132.0 480.0,142.7 520.0,148.0 560.0,150.7" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
 <circle cx="40.0" cy="97.3" r="4.0" fill="var(--ink)"/><circle cx="80.0" cy="108.0" r="4.0" fill="var(--ink)"/><circle cx="120.0" cy="94.7" r="4.0" fill="var(--ink)"/><circle cx="160.0" cy="89.3" r="4.0" fill="var(--ink)"/><circle cx="200.0" cy="102.7" r="4.0" fill="var(--ink)"/><circle cx="240.0" cy="100.0" r="4.0" fill="var(--ink)"/><circle cx="280.0" cy="113.3" r="4.0" fill="var(--ink)"/><circle cx="320.0" cy="110.7" r="4.0" fill="var(--ink)"/><circle cx="360.0" cy="124.0" r="4.0" fill="var(--ink)"/><circle cx="400.0" cy="132.0" r="7.0" fill="var(--ink)"/><line x1="440.0" y1="86.0" x2="440.0" y2="114.0" stroke="var(--ink-muted)" stroke-width="3"/><circle cx="480.0" cy="142.7" r="7.0" fill="var(--ink)"/><circle cx="520.0" cy="148.0" r="7.0" fill="var(--ink)"/>
 <g class="you" transform="translate(560.0 150.7)"><circle r="11" fill="var(--brand)" stroke="var(--surface)" stroke-width="4"/><circle r="3.5" fill="var(--on-brand)"/></g>
 <text x="40.0" y="206" text-anchor="middle" class="tk">6 Nov</text><text x="280.0" y="206" text-anchor="middle" class="tk">12</text><text x="560.0" y="206" text-anchor="middle" class="tk">Today</text>
</svg>
  <div class="legend" aria-label="How to read this">
    <span><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="var(--ink)" stroke-width="3"/></svg>Live</span>
    <span><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="var(--ink)" stroke-width="3" stroke-dasharray="6 4"/></svg>Pending</span>
    <span><svg width="6" height="16"><line x1="3" y1="4" x2="3" y2="12" stroke="var(--ink-muted)" stroke-width="3"/></svg>No data (wristband off)</span>
    <span><svg width="44" height="20"><circle cx="5" cy="10" r="4" fill="var(--ink)"/><circle cx="18" cy="10" r="7" fill="var(--ink)"/><circle cx="34" cy="10" r="10" fill="var(--ink)"/></svg>Distance from your usual</span>
  </div>
</section>
