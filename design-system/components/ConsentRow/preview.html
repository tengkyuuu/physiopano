<!-- @dsCard group="Privacy" height=340 subtitle="Granular, revocable sharing" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600&family=Noto+Kufi+Arabic:wght@400;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}
body{padding:var(--space-4)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:48px;padding:0 var(--space-5);border-radius:var(--radius-control);font:700 16px/1 var(--font-sans);border:1.5px solid transparent;cursor:pointer;transition:transform 140ms cubic-bezier(.16,1,.3,1)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-crisis{background:var(--crisis);color:var(--on-crisis)}
.btn[disabled]{background:var(--surface-sunk);color:var(--ink-muted);border-color:transparent;cursor:not-allowed}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.data{font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-grid;place-items:center;border-radius:var(--radius-pill);font:800 13px/1 var(--font-sans)}
.r1{background:var(--route-1);color:var(--on-route)} .r2{background:var(--route-2);color:var(--on-route)} .r3{background:var(--route-3);color:var(--on-route-3)} .r4{background:var(--route-4);color:var(--on-route)} .r5{background:var(--route-5);color:var(--on-route)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-panel);max-width:560px}
li{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-5);border-top:1px solid var(--line)}
li:first-child{border-top:0}
.t{margin:0;font:700 16px/24px var(--font-sans)}.s{margin:0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.sw{flex:none;width:52px;height:32px;border-radius:var(--radius-pill);border:2px solid var(--ink);background:transparent;padding:0;position:relative;cursor:pointer}
.sw span{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:var(--radius-pill);background:var(--ink);transition:transform 220ms cubic-bezier(.16,1,.3,1)}
.sw[aria-checked="true"]{background:var(--brand);border-color:var(--brand)}
.sw[aria-checked="true"] span{transform:translateX(20px);background:var(--on-brand)}
.lock{display:inline-flex;align-items:center;gap:var(--space-1);font:600 14px/20px var(--font-sans);color:var(--ink-muted)}
</style>
<ul aria-label="What you share"><li><div><p class="t">Wristband signals</p><p class="s">Only on this phone</p></div><button class="sw" role="switch" aria-checked="true" aria-label="Share Wristband signals"><span></span></button></li><li><div><p class="t">Weekly summary</p><p class="s">Your primary-care clinic, until 30 Nov</p></div><button class="sw" role="switch" aria-checked="true" aria-label="Share Weekly summary"><span></span></button></li><li><div><p class="t">Check-in answers</p><p class="s">Not shared</p></div><button class="sw" role="switch" aria-checked="false" aria-label="Share Check-in answers"><span></span></button></li><li><div><p class="t">Your employer</p><p class="s">Never. Employers cannot be added.</p></div><span class="lock"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Locked off</span></li></ul>
<script>document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true')));</script>
