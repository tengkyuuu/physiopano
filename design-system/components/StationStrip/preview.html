<!-- @dsCard group="Wayfinding" height=260 subtitle="The stepped support ladder" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600&family=Noto+Kufi+Arabic:wght@400;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}
body{padding:var(--space-4)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:48px;padding:0 var(--space-5);border-radius:var(--radius-control);font:700 16px/1 var(--font-sans);border:1.5px solid transparent;cursor:pointer;transition:transform 140ms cubic-bezier(.16,1,.3,1)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-crisis{background:var(--crisis);color:var(--on-crisis)}
.btn[disabled]{background:var(--surface-sunk);color:var(--ink-muted);border-color:transparent;cursor:not-allowed}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.data{font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-grid;place-items:center;border-radius:var(--radius-pill);font:800 13px/1 var(--font-sans)}
.r1{background:var(--route-1);color:var(--on-route)} .r2{background:var(--route-2);color:var(--on-route)} .r3{background:var(--route-3);color:var(--on-route-3)} .r4{background:var(--route-4);color:var(--on-route)} .r5{background:var(--route-5);color:var(--on-route)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.strip{position:relative;list-style:none;margin:0;padding:var(--space-4) 0 0;display:grid;grid-template-columns:repeat(5,1fr);max-width:760px}
.strip::before{content:"";position:absolute;left:10%;right:10%;top:calc(var(--space-4) + 21px);height:3px;background:repeating-linear-gradient(90deg,var(--ink-muted) 0 6px,transparent 6px 10px)}
.strip::after{content:"";position:absolute;left:10%;width:20%;top:calc(var(--space-4) + 21px);height:3px;background:var(--ink)}
.st{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-1);padding:0 var(--space-1)}
.st .dot{width:44px;height:44px;border:4px solid var(--ground);position:relative;z-index:1}
.st.next .dot{box-shadow:0 0 0 3px var(--ink)}
.nm{font:800 13px/16px var(--font-sans);margin-top:var(--space-1)}
.lb{font:600 14px/18px var(--font-sans)}
.tag{margin-top:var(--space-1);font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
</style>

ue"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v4"/><path d="M14 8h-4"/><path d="M14 14h-4"/><path d="M14 18h-4"/><path d="M18 12h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2"/><path d="M18 22V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v18"/></svg></span><span class="nm">5</span><span class="lb">Specialist</span></li></ol>
