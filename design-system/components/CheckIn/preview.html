<!-- @dsCard group="Check-in" height=360 subtitle="Validated PHQ-4 / PSS-4 items" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600&family=Noto+Kufi+Arabic:wght@400;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans)}
body{padding:var(--space-4)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:48px;padding:0 var(--space-5);border-radius:var(--radius-control);font:700 16px/1 var(--font-sans);border:1.5px solid transparent;cursor:pointer;transition:transform 140ms cubic-bezier(.16,1,.3,1)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-crisis{background:var(--crisis);color:var(--on-crisis)}
.btn[disabled]{background:var(--surface-sunk);color:var(--ink-muted);border-color:transparent;cursor:not-allowed}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.data{font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-grid;place-items:center;border-radius:var(--radius-pill);font:800 13px/1 var(--font-sans)}
.r1{background:var(--route-1);color:var(--on-route)} .r2{background:var(--route-2);color:var(--on-route)} .r3{background:var(--route-3);color:var(--on-route-3)} .r4{background:var(--route-4);color:var(--on-route)} .r5{background:var(--route-5);color:var(--on-route)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.ci{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-panel);padding:var(--space-5);max-width:560px}
.top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.prog{display:flex;gap:6px}.prog i{width:10px;height:10px;border-radius:var(--radius-pill);border:2px solid var(--ink)}.prog i.on{background:var(--ink)}
.q{margin:var(--space-4) 0 var(--space-4);font:700 24px/30px var(--font-sans);text-wrap:balance}
.opts{display:grid;gap:var(--space-2)}
.opt{display:flex;align-items:center;gap:var(--space-3);min-height:48px;padding:0 var(--space-4);border:1.5px solid var(--line);border-radius:var(--radius-control);background:var(--ground);font:600 16px/20px var(--font-sans);cursor:pointer}
.opt input{accent-color:var(--brand);width:20px;height:20px;margin:0}
.opt:has(input:checked){border-color:var(--ink);background:var(--surface)}
.src{margin-top:var(--space-4);font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
</style>
<form class="ci" onsubmit="event.preventDefault()">
  <div class="top"><span class="cap">Check-in · question 1 of 4</span><span class="prog" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></span></div>
  <p class="q">Over the last 2 weeks, how often have you been bothered by feeling nervous, anxious or on edge?</p>
  <fieldset class="opts" style="border:0;padding:0;margin:0"><legend class="cap" style="padding:0;margin-bottom:var(--space-2)">Choose one</legend><label class="opt"><input type="radio" name="q1" ><span>Not at all</span></label><label class="opt"><input type="radio" name="q1" checked><span>Several days</span></label><label class="opt"><input type="radio" name="q1" ><span>More than half the days</span></label><label class="opt"><input type="radio" name="q1" ><span>Nearly every day</span></label></fieldset>
  <p class="src">PHQ-4, a validated 4-question screen. Your answers stay on this phone unless you choose to share them.</p>
</form>
