<svg xmlns="http://www.w3.org/2000/svg" width="540" height="320" viewBox="0 0 540 320">
  <title>Bring the wristband close to the phone</title>
  <defs>
    <linearGradient id="paper" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#eeedf9"/><stop offset="1" stop-color="#dcdff4"/>
    </linearGradient>
    <linearGradient id="strap" x2=".35" y2="1">
      <stop stop-color="#72809a"/><stop offset=".4" stop-color="#515c78"/>
      <stop offset="1" stop-color="#323e58"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#343e5b"/><stop offset="1" stop-color="#171f32"/>
    </linearGradient>
    <linearGradient id="screen" x2=".3" y2="1">
      <stop stop-color="#f5f4ff"/><stop offset=".55" stop-color="#d9dcfb"/>
      <stop offset="1" stop-color="#c6ceef"/>
    </linearGradient>
    <radialGradient id="shade">
      <stop stop-color="#8389ae" stop-opacity=".38"/><stop offset="1" stop-color="#8389ae" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path fill="url(#paper)" d="M0 0h540v320H0z"/>

  <!-- The phone stays in place. Its Bluetooth glyph never indicates success. -->
  <ellipse cx="384" cy="266" rx="79" ry="14" fill="url(#shade)"/>
  <g transform="rotate(7 385 157)">
    <rect x="326" y="44" width="122" height="220" rx="24" fill="#242d41"/>
    <rect x="323" y="40" width="122" height="220" rx="24" fill="#48536d" stroke="#1e293e" stroke-width="2"/>
    <rect x="329" y="46" width="110" height="207" rx="19" fill="url(#screen)"/>
    <rect x="366" y="51" width="37" height="7" rx="3.5" fill="#333e57"/>
    <rect x="320" y="99" width="3" height="19" rx="1.5" fill="#54617a"/>
    <rect x="320" y="124" width="3" height="14" rx="1.5" fill="#54617a"/>
    <circle cx="384" cy="145" r="31" fill="#bac1f1"/>
    <path d="m373 136 22 19-12 11v-42l12 11-22 20" fill="none" stroke="#44529a"
          stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="363" y="241" width="42" height="3" rx="1.5" fill="#7e88b0"/>
  </g>

  <!-- A spatial cue for the opening pose. It clears as the band approaches. -->
  <g fill="none" stroke="#858db5" stroke-linecap="round" stroke-width="2.5">
    <animate attributeName="opacity" dur="1.6s" values="1;1;0;0" keyTimes="0;.25;.70;1" fill="freeze"/>
    <path d="M187 177 Q230 150 285 154" stroke-dasharray="1 8"/>
    <path d="m279 148 8 6-8 5" stroke-linejoin="round"/>
  </g>

  <!-- Local coordinates keep the shadow grounded as the bracelet changes pose. -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.6s" fill="freeze"
      values="0 0;0 0;82 0;111 0;111 0" keyTimes="0;.18;.62;.87;1" calcMode="spline"
      keySplines="0 0 1 1;.46 0 .62 .8;.18 .7 .35 1;0 0 1 1"/>
    <ellipse cx="127" cy="245" rx="77" ry="15" fill="url(#shade)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.6s" fill="freeze"
        values="0 0;0 0;0 -13;0 0;0 0" keyTimes="0;.18;.57;.87;1" calcMode="spline"
        keySplines="0 0 1 1;.4 0 .2 1;.4 0 .2 1;0 0 1 1"/>
      <g transform="rotate(-9 125 190)">
        <path d="M51 180c0-28 34-53 77-53 44 0 77 22 77 52v12c-1 30-35 54-80 54-45 0-74-28-74-55z"
              fill="url(#strap)" stroke="#303b52" stroke-width="2"/>
        <path d="M58 172c5-22 37-39 71-39s62 15 69 35c6 19-18 35-62 40-45 5-84-13-78-36z"
              fill="#a4aec5" stroke="#495673" stroke-width="2"/>
        <path d="M69 173c11-17 34-24 60-24 28 0 52 8 60 23 7 13-15 25-52 29-35 3-74-9-68-28z"
              fill="#e4e5f5"/>
        <path d="M54 186c2 20 36 39 78 37 37-2 60-14 70-27" fill="none" stroke="#9aa9c1" stroke-opacity=".65" stroke-width="2"/>
        <path d="M173 205l10-6m-7 12 10-6m-6 12 9-6" fill="none" stroke="#303b53" stroke-width="3" stroke-linecap="round"/>
        <g transform="rotate(-8 105 192)">
          <rect x="62" y="160" width="86" height="65" rx="15" fill="#293246" stroke="#1e283c" stroke-width="2"/>
          <rect x="60" y="154" width="86" height="63" rx="15" fill="#66728a" stroke="#2c3850" stroke-width="2"/>
          <rect x="65" y="158" width="76" height="54" rx="12" fill="url(#glass)"/>
          <circle cx="128" cy="167" r="2.6" fill="#8693ac"/>
          <path d="M83 185c6-9 12-9 18 0s12 9 18 0" fill="none" stroke="#a6b5cf" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
